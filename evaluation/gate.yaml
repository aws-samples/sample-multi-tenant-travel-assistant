# The merge decision: quality and cost in one place.
#
# **Why they share a file.** A change that improves accuracy two points and triples spend should not
# merge silently, and it will if quality is gated in CI while cost is reviewed on a dashboard once a
# month. Putting them together makes the trade explicit at the moment it is being made.
#
# Two kinds of threshold, and the difference matters:
#
#   * **Absolute from day one** — isolation, safety, verdicts, schemas, confirm-before-write. These
#     are correctness, not quality. `1.00` because 0.9 on cross-tenant probes means one in ten
#     leaked, and there is no version of that which is acceptable at any maturity.
#   * **Calibrated, then ratcheted** — the cost rows. A threshold guessed before a baseline exists
#     is either so loose it never fires or so tight it fires on the first green run and gets
#     disabled. Each carries the measurement it came from.

quality:
  # Code-based, so these run for free and gate every commit.
  verdict_exact_match: { min: 1.00 } # computed in Python; a near miss has no excuse
  card_schema_valid: { min: 1.00 } # a missing key renders as a blank line
  tenant_isolation: { min: 1.00 } # the property the whole sample exists to show
  # Kept separate from `tenant_isolation`: absence of another tenant's data and presence of the
  # required answer are different properties with different remedies. This row also catches a
  # dependency that fails gracefully and returns no useful result.
  answer_content: { min: 1.00 } # a required fact reached the traveler
  confirm_before_write: { min: 1.00 } # money moves only after an explicit request
  tool_sequence: { min: 0.85 } # more than one chain can be correct, so not absolute

  # LLM judges are advisory and intentionally hold no gate row. `runner/judge.py` collects the
  # runtime's Strands spans and matching log records, submits them inline to `Evaluate`, and prints
  # the scores after the deterministic verdict. `GroundedNarration` has been verified against both a
  # real unsupported claim and a deliberately altered answer. `EscalationWarrant` has not yet had the
  # same watched-failure negative control. A six-turn judge pass consumed 15,360 judge tokens, so
  # enabling it remains an explicit `--judge` choice rather than a default merge requirement.

escalation:
  escalation_package: { min: 1.00 }
  # **The half a judge cannot see.** `escalation_package` proves a package exists; this proves the
  # right thing decided to hand off and that nothing carried on afterwards. A runtime-fired handoff
  # never passes through the model's conversation, so no trace-reading judge can score it: asked
  # when the agent escalated, a session-level judge reports that it never did. The judgement of
  # *whether* a human was warranted stays with `EscalationWarrant`, advisory and ungated.
  escalation_trigger: { min: 1.00 }

cost:
  # **Calibrated from measurement, not from taste.** A warm one-tool answer on this deployment costs
  # $0.008581 (input $0.003255, output $0.001785, cache read $0.0035406 — cache read is the largest
  # component at 41%). A cold two-tool answer with a knowledge-base call costs $0.031651.
  #
  # The $0.30 average ceiling is deliberately loose relative to the current baseline. It is also
  # 1.12x the dearest measured single turn ($0.268115), but those are different measurements; the
  # separate p95 trajectory row below catches isolated runaway turns.
  #
  # Two rows rather than one because they fail differently: a single runaway trajectory moves the
  # p95 long before it moves an average over the whole suite. Ratchet down once a run-to-run spread
  # is known — one baseline is a point, not a distribution, and repeated runs of this suite have
  # measured $0.0163 to $0.0203 per successful task on near-identical code.

  # Spend divided by runs that satisfied their fixtures. This includes expected handoffs even when
  # nobody received them, so the name describes evaluation success rather than customer resolution.
  usd_per_successful_task: { max: 0.30 }

  # Spend over turns where the traveler was actually helped: `completed` plus `handoff_delivered`.
  # This is necessarily the larger figure because every turn's spend remains in the numerator.
  #
  # Gated at the same ceiling deliberately. It is the row that degrades when the agent starts handing
  # more conversations over, which is a real regression that the old single figure could not express:
  # more handoffs made the denominator *bigger* and the number look better.
  usd_per_customer_resolved: { max: 0.30 }
  p95_usd_trajectory: { max: 0.60 }

  # Steps are what a person perceives as "it's stuck". A clean answer is 2 steps measured.
  p50_steps: { max: 5 }
  p95_steps: { max: 10 }

  # Observed from the SDK's own counters rather than inferred. Measured warm: 11,802 cache-read
  # tokens against 1,085 fresh input, so the achievable rate is far above this floor — it is set to
  # catch the prefix being broken, which is the failure that silently trebles cost.
  cache_hit_rate: { min: 0.70 }

  # A reflection step is a model-only step followed by more work. The final model-only reply is not
  # reflection because the trajectory ends there. See `agent/.../ledger.py`.
  reflection_step_rate: { max: 0.15 }

# Runs are not free, so the harness stops rather than discovers the bill afterwards. One team
# reports a $3,900 overnight bill from an eval suite with no ceiling: a bot opened 41 pull requests
# and the merge queue re-ran the full suite on every push and rebase, ~270 runs. The per-run cost was
# never the problem.
#
# ~$0.96 for 58 agent runs at the latest measured mix, plus ~$2.83 once five judges score each trace. The
# ceiling sits above that with room for a slow day, and a breach stops the run rather than failing
# the gate — an aborted run has proven nothing about quality and must not read as a quality verdict.
limits:
  max_usd_per_run: 8.00

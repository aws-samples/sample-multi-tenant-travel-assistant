[project]
name = "multi-tenant-travel-backend"
version = "0.1.0"
description = "Mock TMC backend — stands in for the customer's existing travel platform"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # **The previous cap here was wrong, and it was holding back seven CVEs.**
    #
    # It read `fastapi<0.130` + `starlette<1.0`, justified on the grounds that
    # `include_router` "silently registers no routes" under starlette 1.x,
    # verified by a control case returning an empty route table. The observation
    # was real; the conclusion was not. starlette 1.x nests included routes under
    # a single `_IncludedRouter` object instead of flattening them into
    # `app.routes`, so a probe that looks for `route.path` finds nothing and
    # concludes the registration failed. Re-tested against fastapi 0.141.1 with
    # starlette 1.6.0: the same three-line case answers `GET /v1/ping` with 200.
    # The routes were always registered; only their representation changed.
    #
    # Nothing in this repository enumerates `app.routes` (`main.py` calls
    # `include_router` and reads nothing back), so the representation change is
    # invisible here.
    #
    # Keeping the cap would have meant carrying starlette 0.52.1 and its seven
    # advisories: CVE-2026-48710 and CVE-2026-54282 (unvalidated Host header and
    # path when reconstructing `request.url`), CVE-2026-54283 (form limits not
    # enforced for urlencoded bodies), CVE-2026-48817 (HTTPEndpoint method
    # dispatch via getattr) and CVE-2026-48818. Every fix ships in 1.x, so no
    # 0.x line resolves them.
    "fastapi>=0.141",
    "starlette>=1.3.1",
    "pydantic>=2.9",
    "boto3>=1.35",
    "mangum>=0.19",           # ASGI -> Lambda adapter
    # Structured logging + EMF metrics + tracing. EMF matters because it turns a
    # log line into a dimensioned CloudWatch metric with no PutMetricData call —
    # which is how cost-per-tenant becomes queryable rather than grep-able.
    "aws-lambda-powertools>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",            # FastAPI TestClient transport
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's dependency injection is expressed through call-in-default
# (`Query(...)`, `Depends(...)`); B008 exists for mutable defaults, not this.
extend-ignore = ["B008"]
